<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>个人作品集</title>
    <meta name="description" content="个人作品集 PDF 在线阅览。" />
    <meta property="og:title" content="个人作品集" />
    <meta property="og:description" content="在线浏览个人作品集 PDF。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://talent.ccwu.cc/" />
    <meta property="og:image" content="https://talent.ccwu.cc/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://talent.ccwu.cc/og.png" />
    <link rel="canonical" href="https://talent.ccwu.cc/" />
    <link rel="stylesheet" href="styles.css?v=pdf-only-1" />
  </head>
  <body>
    <main class="pdf-viewer" aria-label="个人作品集 PDF 阅读器">
      <header class="pdf-toolbar" role="toolbar" aria-label="PDF 阅读控制">
        <div class="toolbar-group page-controls">
          <button id="previous-page" type="button" aria-label="上一页" disabled>‹</button>
          <label class="page-number" for="page-input">
            <span class="visually-hidden">跳转到页码</span>
            <input id="page-input" type="number" min="1" value="1" inputmode="numeric" disabled />
            <span aria-hidden="true">/</span>
            <span id="page-count" aria-live="polite">—</span>
          </label>
          <button id="next-page" type="button" aria-label="下一页" disabled>›</button>
        </div>

        <div class="toolbar-group zoom-controls">
          <button id="zoom-out" type="button" aria-label="缩小" disabled>−</button>
          <span id="zoom-label" aria-live="polite">适合宽度</span>
          <button id="zoom-in" type="button" aria-label="放大" disabled>＋</button>
          <button class="fit-button" id="fit-width" type="button" disabled>适合宽度</button>
        </div>
      </header>

      <section class="pdf-scroll" id="pdf-scroll" aria-busy="true" aria-label="作品集页面">
        <div class="loading-panel" id="loading-panel" role="status">
          <span id="loading-label">正在打开 PDF…</span>
          <div class="loading-track" aria-hidden="true"><span id="loading-progress"></span></div>
        </div>

        <div class="pdf-pages" id="pdf-pages"></div>

        <div class="error-panel" id="error-panel" hidden>
          <strong>PDF 暂时无法显示</strong>
          <a href="portfolio.pdf">打开原始 PDF</a>
        </div>
      </section>
    </main>

    <script type="module" src="viewer.js?v=pdf-only-1"></script>
  </body>
</html>
