<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人作品集 | Portfolio</title>
    <meta name="description" content="个人作品集在线阅览与 PDF 下载。" />
    <meta property="og:title" content="个人作品集 | Portfolio" />
    <meta property="og:description" content="在线浏览精选作品，或下载完整 PDF。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://talent.ccwu.cc/" />
    <meta property="og:image" content="https://talent.ccwu.cc/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://talent.ccwu.cc/og.png" />
    <link rel="canonical" href="https://talent.ccwu.cc/" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="返回作品集顶部">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>PORTFOLIO</span>
      </a>
      <nav class="actions" aria-label="作品集操作">
        <a class="text-link" href="#reader">开始阅读</a>
        <a class="download-button" href="portfolio.pdf" download="个人作品集.pdf">下载 PDF</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="top">
        <div class="hero-copy">
          <p class="eyebrow">SELECTED WORK · 2026</p>
          <h1>个人作品集<span>Portfolio</span></h1>
          <p class="intro">欢迎浏览我的作品集。你可以在下方直接翻阅，也可以打开全屏模式或下载 PDF。</p>
        </div>
        <div class="hero-index" aria-hidden="true">
          <span>01</span><div></div><span>VIEW</span>
        </div>
      </section>

      <section class="viewer-section" aria-labelledby="viewer-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">DOCUMENT VIEWER</p>
            <h2 id="viewer-title">在线阅览</h2>
          </div>
          <p>电脑可使用方向键翻页，手机可以左右滑动</p>
        </div>
        <div class="reader" id="reader" tabindex="-1" aria-label="作品集在线阅读器">
          <div class="reader-toolbar" role="toolbar" aria-label="PDF 阅读控制">
            <div class="toolbar-group page-controls">
              <button class="reader-button reader-button-wide" id="prev-page" type="button" disabled>
                <span aria-hidden="true">←</span> 上一页
              </button>
              <label class="page-jump" for="page-input">
                <span class="sr-only">跳转至页码</span>
                <input id="page-input" type="number" min="1" value="1" inputmode="numeric" disabled />
                <span aria-hidden="true">/</span>
                <span id="page-count" aria-live="polite">—</span>
              </label>
              <button class="reader-button reader-button-wide" id="next-page" type="button" disabled>
                下一页 <span aria-hidden="true">→</span>
              </button>
            </div>
            <div class="toolbar-group view-controls">
              <button class="reader-button icon-button" id="zoom-out" type="button" aria-label="缩小" disabled>−</button>
              <span class="zoom-value" id="zoom-value" aria-live="polite">适合页面</span>
              <button class="reader-button icon-button" id="zoom-in" type="button" aria-label="放大" disabled>＋</button>
              <button class="reader-button fit-button" id="fit-page" type="button" disabled>适合页面</button>
              <button class="reader-button fullscreen-button" id="fullscreen" type="button">全屏</button>
            </div>
          </div>

          <div class="reader-stage" id="reader-stage" aria-busy="true">
            <div class="reader-loading" id="reader-loading" role="status">
              <span class="loading-kicker">LOADING PORTFOLIO</span>
              <strong id="loading-label">正在加载作品集…</strong>
              <div class="loading-track" aria-hidden="true"><span id="loading-progress"></span></div>
            </div>
            <canvas id="pdf-canvas" aria-label="作品集第 1 页"></canvas>
            <div class="reader-error" id="reader-error" hidden>
              <strong>在线阅读器加载失败</strong>
              <p>你仍然可以下载完整作品集。</p>
              <a href="portfolio.pdf" download="个人作品集.pdf">下载 PDF</a>
            </div>
          </div>

          <div class="reader-mobile-nav" aria-label="手机翻页控制">
            <button id="mobile-prev" type="button" disabled>← 上一页</button>
            <span id="mobile-page-status">第 1 页</span>
            <button id="mobile-next" type="button" disabled>下一页 →</button>
          </div>

          <p class="swipe-hint">手机左右滑动翻页 · 可横屏或全屏阅读</p>
          <noscript><p class="noscript-message">请启用 JavaScript 以在线阅读，或<a href="portfolio.pdf">下载 PDF</a>。</p></noscript>
        </div>
      </section>
    </main>

    <footer>
      <p>THANK YOU FOR VIEWING</p>
      <a href="#top">返回顶部 ↑</a>
    </footer>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
